services:
  postgres:
    image: postgres:17
    container_name: payflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - app_data:/var/lib/postgresql/data
volumes:
  app_data:
